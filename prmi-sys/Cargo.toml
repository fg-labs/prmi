[package]
name = "prmi-sys"
description = "C ABI shim for the prmi crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["bioinformatics", "genomics", "ffi", "learned-index", "c-api"]
categories = ["external-ffi-bindings", "science"]
readme = "../README.md"
homepage = "https://github.com/fg-labs/prmi"
documentation = "https://docs.rs/prmi-sys"

[lib]
name = "prmi_sys"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
prmi = { path = "../prmi", version = "0.1.0" }
libc.workspace = true

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cbindgen = "0.27"
