[package]
name = "prmi-sys"
description = "C ABI shim for the prmi crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["bioinformatics", "genomics", "ffi", "learned-index", "c-api"]
categories = ["external-ffi-bindings", "science"]
readme = "../README.md"
homepage = "https://github.com/fg-labs/prmi"
documentation = "https://docs.rs/prmi-sys"

[lib]
name = "prmi_sys"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Forward prmi's thread-local SA-probe counter through the C ABI
# (prmi_probe_count_{enabled,reset,get}). OFF by default — the production hot
# path carries no counter. Build with `--features spectrum-probe-count` for
# in-situ `--seeding-only` instrumentation runs.
spectrum-probe-count = ["prmi/spectrum-probe-count"]

[dependencies]
prmi = { path = "../prmi", version = "0.1.0" }
libc.workspace = true

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cbindgen = "0.27"
